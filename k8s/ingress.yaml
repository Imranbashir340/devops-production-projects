apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-prod-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: devops-prod.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-prod-service
                port:
                  number: 80