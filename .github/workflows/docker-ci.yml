name: Docker CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-prod-app:$IMAGE_TAG .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-prod-app:$IMAGE_TAG

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: imranbashir340/devops-prod-app:IMAGE_TAG|image: ${{ secrets.DOCKER_USERNAME }}/devops-prod-app:${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml

      - name: Commit and Push Manifest Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update deployment image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin main